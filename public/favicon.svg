<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#062d24"/>
      <stop offset="100%" stop-color="#091815"/>
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" stroke="url(#primaryGlow)" stroke-width="12"/>

  <g filter="url(#glowEffect)">
    <!-- Left Bracket < -->
    <path d="M 180 160 L 100 256 L 180 352" fill="none" stroke="url(#primaryGlow)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Bracket > -->
    <path d="M 332 160 L 412 256 L 332 352" fill="none" stroke="url(#primaryGlow)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Center Play Icon Triangle ▶ -->
    <path d="M 220 185 L 314 256 L 220 327 Z" fill="url(#accentGlow)" stroke="url(#primaryGlow)" stroke-width="12" stroke-linejoin="round"/>
  </g>
</svg>

